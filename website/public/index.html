<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toveli — AI Travel Planner</title>
<meta name="description" content="Plan your perfect trip with AI. Toveli builds personalized itineraries, finds the best activities, and keeps everything organized.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    color: #111827;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .logo {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 12px;
  }
  .tagline {
    font-size: 20px;
    color: #6b7280;
    max-width: 400px;
    line-height: 1.5;
    margin-bottom: 40px;
  }
  .cta {
    display: inline-block;
    background: #111827;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 12px;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .cta:hover { opacity: 0.85; }
  .links {
    margin-top: 48px;
    display: flex;
    gap: 24px;
  }
  .links a {
    font-size: 13px;
    color: #9ca3af;
    text-decoration: none;
  }
  .links a:hover { color: #6b7280; }
  @media (prefers-color-scheme: dark) {
    body { background: #09090f; color: #f9fafb; }
    .tagline { color: #9ca3af; }
    .cta { background: #f9fafb; color: #09090f; }
    .links a { color: #6b7280; }
    .links a:hover { color: #9ca3af; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="logo">Toveli</div>
  <p class="tagline">Plan your perfect trip with AI. Personalized itineraries, smart suggestions, everything in one place.</p>
  <a class="cta" href="#">Download on the App Store</a>
  <div class="links">
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
  </div>
</div>
</body>
</html>
